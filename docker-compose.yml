# Full local stack: frontend, backend and Ollama.
#
#   docker compose up --build        then open http://localhost:3000
#
# The first start downloads the model (MODEL_NAME, default qwen2.5-coder:3b, ~2 GB).
#
# Security: this is the LOCAL setup, with login off, so every published port
# is bound to 127.0.0.1 (this machine only, not your network). Ollama is not
# published at all; only the backend can reach it. For a server, use
# docker-compose.prod.yml instead (login, HTTPS, rate limits).
#
# Already running Ollama on this machine? Skip the bundled one:
#   OLLAMA_BASE_URL=http://host.docker.internal:11434 docker compose up --build --no-deps frontend backend

services:
  ollama:
    image: ollama/ollama:0.40.13
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # One-shot: pull the model into the bundled Ollama, then exit. A failed
  # pull (offline, or a network that intercepts HTTPS) only warns, so the
  # app still starts; pull later with:
  #   docker compose exec ollama ollama pull qwen2.5-coder:3b
  ollama-pull:
    image: ollama/ollama:0.40.13
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull ${MODEL_NAME:-qwen2.5-coder:3b}
        || echo "WARNING: could not download ${MODEL_NAME:-qwen2.5-coder:3b}. Audits will fail until it is pulled:
        docker compose exec ollama ollama pull ${MODEL_NAME:-qwen2.5-coder:3b}"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      MODEL_NAME: ${MODEL_NAME:-qwen2.5-coder:3b}
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MAX_FILES_PER_AUDIT: ${MAX_FILES_PER_AUDIT:-25}
    volumes:
      - auditor_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_models:
  auditor_data:
