name: Desktop app

# Builds the Windows desktop app, smoke-tests the packaged .exe, and keeps
# it as a downloadable artifact. Pushing a version tag (e.g. v0.7.0) also
# publishes it as a GitHub Release. Free for public repositories.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "backend/**"
      - "src/**"
      - "rules/**"
      - "frontend/**"
      - "requirements*.txt"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build and smoke-test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements-desktop.txt
          cd frontend
          npm ci

      - name: Build the UI (static export)
        working-directory: frontend
        run: npm run build:desktop

      - name: Package with PyInstaller
        run: pyinstaller desktop/auditor.spec --noconfirm --distpath build/desktop/dist --workpath build/desktop/work

      - name: Smoke-test the packaged app
        # Starts the bundled server, runs a tools-only audit through its API
        # and checks bandit and ruff findings, then exits.
        shell: pwsh
        run: |
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP "auditor-smoke"
          $p = Start-Process build/desktop/dist/MultiAgentAuditor/MultiAgentAuditor.exe -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          Get-Content (Join-Path $env:DATA_DIR "logs/app.log") -Tail 20
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/desktop/dist/MultiAgentAuditor -DestinationPath MultiAgentAuditor-windows-x64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MultiAgentAuditor-windows-x64
          path: MultiAgentAuditor-windows-x64.zip
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write    # only this job can create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MultiAgentAuditor-windows-x64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MultiAgentAuditor-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" --title "Multi-Agent Code Auditor $GITHUB_REF_NAME" --generate-notes
