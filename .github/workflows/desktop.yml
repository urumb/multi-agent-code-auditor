name: Desktop app

# Builds the Windows desktop app, smoke-tests the packaged .exe, and keeps
# it as a downloadable artifact. Pushing a version tag (e.g. v0.7.0) also
# publishes it as a GitHub Release. Free for public repositories.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "backend/**"
      - "src/**"
      - "rules/**"
      - "frontend/**"
      - "requirements*.txt"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build and smoke-test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements-desktop.txt
          cd frontend
          npm ci

      - name: Build the UI (static export)
        working-directory: frontend
        run: npm run build:desktop

      - name: Package with PyInstaller
        run: pyinstaller desktop/auditor.spec --noconfirm --distpath build/desktop/dist --workpath build/desktop/work

      - name: Smoke-test the packaged app
        # Starts the bundled server, runs a tools-only audit through its API
        # and checks bandit and ruff findings, then exits.
        shell: pwsh
        run: |
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP "auditor-smoke"
          $p = Start-Process build/desktop/dist/MultiAgentAuditor/MultiAgentAuditor.exe -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          Get-Content (Join-Path $env:DATA_DIR "logs/app.log") -Tail 20
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/desktop/dist/MultiAgentAuditor -DestinationPath MultiAgentAuditor-windows-x64.zip

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path desktop/app.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not $v) { throw "APP_VERSION not found in desktop/app.py" }
          # A release tag must match the version the app reports.
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match APP_VERSION $v in desktop/app.py"
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup, preinstalled on the runner)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc desktop\installer.iss "/DAppVersion=${{ steps.version.outputs.value }}"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Test install, run, uninstall
        # The installer must install without admin rights, the installed app
        # must pass the smoke test, and uninstalling must remove it.
        shell: pwsh
        run: |
          $setup = "build\desktop\installer\MultiAgentAuditor-Setup-${{ steps.version.outputs.value }}.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed ($($p.ExitCode))" }

          $dir = Join-Path $env:LOCALAPPDATA "Programs\Multi-Agent Code Auditor"
          $exe = Join-Path $dir "MultiAgentAuditor.exe"
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Multi-Agent Code Auditor.lnk"
          if (-not (Test-Path $exe)) { throw "Installed app not found at $exe" }
          if (-not (Test-Path $lnk)) { throw "Start menu shortcut not found" }

          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP "auditor-installed"
          $s = Start-Process $exe -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          if ($s.ExitCode -ne 0) { throw "Installed app failed its smoke test ($($s.ExitCode))" }

          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          # The uninstaller hands off to a temporary copy of itself and returns
          # early: wait for the files to actually go.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "Uninstall left the app behind" }
          if (Test-Path $lnk) { throw "Uninstall left the Start menu shortcut behind" }
          "install / smoke test / uninstall: ok"

      - name: Collect downloads
        # Side by side at the top level: an artifact keeps each file's folder
        # path, and the release job looks for both files by name.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          Move-Item MultiAgentAuditor-windows-x64.zip release-files/
          Copy-Item build/desktop/installer/MultiAgentAuditor-Setup-*.exe release-files/
          Get-ChildItem release-files

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MultiAgentAuditor-windows-x64
          path: release-files/*
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write    # only this job can create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MultiAgentAuditor-windows-x64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la
          gh release create "$GITHUB_REF_NAME" MultiAgentAuditor-Setup-*.exe MultiAgentAuditor-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" --title "Multi-Agent Code Auditor $GITHUB_REF_NAME" --generate-notes
